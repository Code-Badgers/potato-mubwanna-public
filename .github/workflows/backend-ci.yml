name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"
      - "backend/**"
      - "deploy/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/backend-deploy.yml"
      - "backend/**"
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Test and build backend
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Run backend tests and build
        working-directory: backend
        run: ./gradlew test build --no-daemon

      - name: Validate production Compose
        working-directory: deploy
        run: |
          docker compose --env-file .env.example -f compose.prod.yml config --quiet
          bash tests/deploy-backend-test.sh

      - name: Build backend container image
        run: docker build --file backend/Dockerfile --tag potato-mubwanna-backend:ci backend
