name: Backend Production Deploy

on:
  workflow_dispatch:
    inputs:
      existing_image_tag:
        description: Existing EC2-local image tag to deploy for rollback; leave empty to build the selected ref
        required: false
        type: string
  push:
    branches:
      - main
    tags:
      - "backend-v*"
    paths:
      - ".github/workflows/backend-deploy.yml"
      - "backend/**"
      - "deploy/**"

concurrency:
  group: backend-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build on EC2 and deploy with SSM
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate deployment variables
        shell: bash
        run: |
          : "${AWS_REGION:?Set production variable AWS_REGION}"
          : "${AWS_ROLE_ARN:?Set production variable AWS_ROLE_ARN}"
          : "${EC2_INSTANCE_ID:?Set production variable EC2_INSTANCE_ID}"

          case "${GITHUB_REF}" in
            refs/heads/main|refs/tags/backend-v*) ;;
            *)
              echo "Production deployment only accepts main or backend-v* tags." >&2
              exit 1
              ;;
          esac

      - name: Run backend tests and validate Compose
        shell: bash
        run: |
          ./backend/gradlew -p backend test build --no-daemon
          docker compose --env-file deploy/.env.example -f deploy/compose.prod.yml config --quiet
          bash deploy/tests/deploy-backend-test.sh
          bash deploy/tests/sync-tour-api-secret-test.sh
          bash deploy/tests/caddy-config-test.sh
          bash deploy/tests/nginx-legal-page-test.sh

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: github-actions-backend-deploy
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync external API production secrets
        shell: bash
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          TOUR_API_SERVICE_KEY: ${{ secrets.TOUR_API_SERVICE_KEY }}
          CONGESTION_API_SERVICE_KEY: ${{ secrets.CONGESTION_API_SERVICE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          ODII_API_SERVICE_KEY: ${{ secrets.ODII_API_SERVICE_KEY }}
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
          FIREBASE_ADMIN_ENABLED: ${{ vars.FIREBASE_ADMIN_ENABLED }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          bash deploy/sync-kakao-rest-api-secret.sh
          bash deploy/sync-tour-api-secret.sh
          bash deploy/sync-tour-derived-api-secrets.sh
          bash deploy/sync-google-places-secret.sh
          bash deploy/sync-odii-api-secret.sh
          bash deploy/sync-firebase-production-config.sh
          bash deploy/sync-firebase-service-account-secret.sh

      - name: Resolve local image tag
        id: image
        shell: bash
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.existing_image_tag }}
        run: |
          set -euo pipefail

          image_tag="sha-${GITHUB_SHA:0:12}"
          build_image=true

          if [[ -n "${REQUESTED_IMAGE_TAG:-}" ]]; then
            if [[ ! "${REQUESTED_IMAGE_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9._-]{0,127}$ ]]; then
              echo "Invalid local image tag: ${REQUESTED_IMAGE_TAG}" >&2
              exit 1
            fi
            image_tag="${REQUESTED_IMAGE_TAG}"
            build_image=false
          fi

          {
            echo "image_tag=${image_tag}"
            echo "image_uri=potato-mubwanna-backend:${image_tag}"
            echo "build_image=${build_image}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build and deploy through SSM
        id: deploy
        shell: bash
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          BUILD_IMAGE: ${{ steps.image.outputs.build_image }}
        run: |
          set -euo pipefail

          jq -n \
            --arg git_sha "${GITHUB_SHA}" \
            --arg image_uri "${IMAGE_URI}" \
            --arg build_image "${BUILD_IMAGE}" \
            '{commands: [
              "set -eu",
              "cd /opt/potato-mubwanna",
              "sudo -u ubuntu git fetch --prune --tags origin main",
              ("sudo -u ubuntu git checkout --detach " + $git_sha),
              ("bash deploy/deploy-backend.sh " + $image_uri + " " + $build_image)
            ]}' > ssm-parameters.json

          command_id="$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name AWS-RunShellScript \
            --comment "Deploy backend ${GITHUB_SHA}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "command_id=${command_id}" >> "${GITHUB_OUTPUT}"
          deadline=$((SECONDS + 1800))
          while (( SECONDS < deadline )); do
            deployment_status="$(aws ssm get-command-invocation \
              --command-id "${command_id}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text 2>/dev/null || true)"

            case "${deployment_status}" in
              Success|Cancelled|Failed|TimedOut)
                break
                ;;
            esac

            sleep 10
          done

          aws ssm get-command-invocation \
            --command-id "${command_id}" \
            --instance-id "${EC2_INSTANCE_ID}" \
            --no-cli-pager \
            --output json > ssm-result.json

          jq -r '.StandardOutputContent' ssm-result.json
          jq -r '.StandardErrorContent' ssm-result.json >&2
          test "$(jq -r '.Status' ssm-result.json)" = "Success"
