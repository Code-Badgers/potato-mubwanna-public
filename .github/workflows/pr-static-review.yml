name: PR Static Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - ".github/workflows/pr-static-review.yml"
      - ".semgrep.yml"
      - "backend/**"
      - "frontend/**"

concurrency:
  group: pr-static-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  semgrep:
    name: Semgrep review
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: python -m pip install --disable-pip-version-check semgrep==1.170.1

      - name: Scan changed code
        run: >-
          semgrep scan
          --config p/default
          --config .semgrep.yml
          --metrics=off
          --sarif
          --output semgrep.sarif
          --exclude artifacts
          --exclude frontend/build
          --exclude backend/build
          .

      - name: Set up reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1.5.0
        with:
          reviewdog_version: v0.21.0

      - name: Publish review findings
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          reviewdog
          -f=sarif
          -name=semgrep
          -reporter=github-pr-review
          -filter-mode=added
          -fail-level=error
          -level=warning
          < semgrep.sarif
