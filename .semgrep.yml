rules:
  - id: potato.java.no-legacy-javax-persistence
    languages:
      - java
    message: Spring Boot 3에서는 jakarta.persistence 패키지를 사용해야 합니다.
    severity: ERROR
    pattern-regex: 'import\s+javax\.persistence\.'
    paths:
      include:
        - backend/src/main/**/*.java
        - backend/src/test/**/*.java

  - id: potato.java.no-console-output
    languages:
      - java
    message: 애플리케이션 로그는 System.out/err 대신 프로젝트 로거를 사용하세요.
    severity: WARNING
    pattern-either:
      - pattern: System.out.$METHOD(...)
      - pattern: System.err.$METHOD(...)
    paths:
      include:
        - backend/src/main/**/*.java

  - id: potato.flutter.no-direct-dio-construction
    languages:
      - dart
    message: 공통 인증·오류 처리를 유지하도록 dioClientProvider의 Dio를 사용하세요.
    severity: WARNING
    pattern: Dio(...)
    paths:
      include:
        - frontend/lib/**/*.dart
      exclude:
        - frontend/lib/core/network/**

  - id: potato.flutter.no-debug-output
    languages:
      - dart
    message: 배포 코드에서는 print/debugPrint 대신 프로젝트 로깅 경로를 사용하세요.
    severity: WARNING
    pattern-either:
      - pattern: print(...)
      - pattern: debugPrint(...)
    paths:
      include:
        - frontend/lib/**/*.dart
