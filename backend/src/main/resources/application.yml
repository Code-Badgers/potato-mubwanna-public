spring:
  application:
    name: potato-mubwanna-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/potato_mubwanna}
    username: ${DB_USERNAME:potato}
    password: ${DB_PASSWORD:potato}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /docs

auth:
  kakao:
    user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-please}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}

management:
  endpoints:
    web:
      exposure:
        include: health,info
