spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  application:
    name: potato-mubwanna-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/potato_mubwanna}
    username: ${DB_USERNAME:potato}
    password: ${DB_PASSWORD:potato}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  servlet:
    context-path: /api

springdoc:
  swagger-ui:
    path: /docs

auth:
  admin:
    user-ids: ${ADMIN_USER_IDS:}
  kakao:
    user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
    token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    rest-api-key: ${KAKAO_REST_API_KEY:}
  jwt:
    secret: ${JWT_SECRET:local-development-jwt-secret-change-me-please}
    access-token-ttl-seconds: ${JWT_ACCESS_TOKEN_TTL_SECONDS:3600}
    refresh-token-ttl-seconds: ${JWT_REFRESH_TOKEN_TTL_SECONDS:1209600}

coupon:
  qr:
    secret: ${COUPON_QR_SECRET:${JWT_SECRET:local-development-jwt-secret-change-me-please}}
    ttl-seconds: ${COUPON_QR_TTL_SECONDS:300}

mission:
  upload:
    storage-type: ${MISSION_UPLOAD_STORAGE_TYPE:local}
    local-dir: ${MISSION_UPLOAD_LOCAL_DIR:local-runtime/mission-uploads}

push:
  firebase:
    enabled: ${FIREBASE_ADMIN_ENABLED:false}
    project-id: ${FIREBASE_PROJECT_ID:}
    service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
  token:
    stale-days: ${PUSH_TOKEN_STALE_DAYS:60}

external:
  related-tourism-api:
    base-url: ${RELATED_TOURISM_API_BASE_URL:https://apis.data.go.kr/B551011/TarRlteTarService1}
    search-keyword-path: ${RELATED_TOURISM_API_SEARCH_KEYWORD_PATH:/searchKeyword1}
    service-key: ${RELATED_TOURISM_API_SERVICE_KEY:}
    mobile-os: ${RELATED_TOURISM_API_MOBILE_OS:ETC}
    mobile-app: ${RELATED_TOURISM_API_MOBILE_APP:potato-mubwanna}
    base-year-month: ${RELATED_TOURISM_API_BASE_YM:202504}
    area-code: ${RELATED_TOURISM_API_AREA_CODE:51}
  odii-api:
    base-url: ${ODII_API_BASE_URL:https://apis.data.go.kr/B551011/Odii}
    story-search-path: ${ODII_API_STORY_SEARCH_PATH:/storySearchList}
    service-key: ${ODII_API_SERVICE_KEY:}
    mobile-os: ${ODII_API_MOBILE_OS:ETC}
    mobile-app: ${ODII_API_MOBILE_APP:potato-mubwanna}
    language: ${ODII_API_LANGUAGE:ko}
  tour-api:
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
    search-keyword-path: ${TOUR_API_SEARCH_KEYWORD_PATH:/searchKeyword2}
    service-key: ${TOUR_API_SERVICE_KEY:}
    mobile-os: ${TOUR_API_MOBILE_OS:ETC}
    mobile-app: ${TOUR_API_MOBILE_APP:potato-mubwanna}
    legal-region-code: ${TOUR_API_LEGAL_REGION_CODE:51}
    spot-keywords: ${TOUR_API_SPOT_KEYWORDS:감자,감자빵,감자전,옹심이,감자옹심이,감자떡,알감자,회오리감자,감자체험,감자축제,감자꽃,감자밭,전통시장 감자,로컬푸드 감자,감자 맥주}
    import-on-startup: ${TOUR_API_IMPORT_ON_STARTUP:false}
    import-page-size: ${TOUR_API_IMPORT_PAGE_SIZE:50}
    import-max-pages: ${TOUR_API_IMPORT_MAX_PAGES:1}
  congestion-api:
    base-url: ${CONGESTION_API_BASE_URL:https://apis.data.go.kr/B551011/TatsCnctrRateService}
    prediction-path: ${CONGESTION_API_PREDICTION_PATH:/tatsCnctrRateList}
    service-key: ${CONGESTION_API_SERVICE_KEY:${TOUR_API_SERVICE_KEY:}}
    mobile-os: ${CONGESTION_API_MOBILE_OS:ETC}
    mobile-app: ${CONGESTION_API_MOBILE_APP:potato-mubwanna}
    content-id-param: ${CONGESTION_API_CONTENT_ID_PARAM:contentId}
    sync-on-startup: ${CONGESTION_API_SYNC_ON_STARTUP:false}
  kakao-local:
    keyword-search-url: ${KAKAO_LOCAL_KEYWORD_SEARCH_URL:https://dapi.kakao.com/v2/local/search/keyword.json}
    rest-api-key: ${KAKAO_REST_API_KEY:}
    spot-keywords: ${KAKAO_LOCAL_SPOT_KEYWORDS:강원 감자빵,강릉 감자빵,춘천 감자 카페,평창 감자 체험,강원 감자전,강원 옹심이,강원 알감자,강원 로컬푸드 감자,강원 감자 맥주,강원 감자 직판장}

management:
  endpoints:
    web:
      exposure:
        include: health,info
