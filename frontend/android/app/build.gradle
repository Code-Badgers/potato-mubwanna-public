plugins {
    id "com.android.application"
    id "com.android.built-in-kotlin"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

def kakaoNativeAppKey = localProperties.getProperty('kakao.nativeAppKey')
if (kakaoNativeAppKey == null) {
    kakaoNativeAppKey = System.getenv('KAKAO_NATIVE_APP_KEY') ?: ''
}

def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: ''
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD') ?: ''
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS') ?: ''
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD') ?: ''
def isReleaseTaskRequested = gradle.startParameter.taskNames.any { taskName ->
    taskName.toLowerCase().contains('release')
}
def dartDefines = [:]
if (project.hasProperty('dart-defines')) {
    project.property('dart-defines').split(',').each { encodedDefine ->
        def decodedDefine = new String(encodedDefine.decodeBase64(), 'UTF-8')
        def separator = decodedDefine.indexOf('=')
        if (separator > 0) {
            dartDefines[decodedDefine.substring(0, separator)] =
                decodedDefine.substring(separator + 1)
        }
    }
}
def missingReleaseConfiguration = new LinkedHashSet([
    'KAKAO_NATIVE_APP_KEY': kakaoNativeAppKey,
    'ANDROID_KEYSTORE_PATH': releaseKeystorePath,
    'ANDROID_KEYSTORE_PASSWORD': releaseKeystorePassword,
    'ANDROID_KEY_ALIAS': releaseKeyAlias,
    'ANDROID_KEY_PASSWORD': releaseKeyPassword,
].findAll { _, value -> value.trim().isEmpty() }.keySet())
def requiredLegalDartDefines = [
    'LEGAL_BUSINESS_NAME',
    'LEGAL_REPRESENTATIVE_NAME',
    'LEGAL_CONTACT_EMAIL',
    'LEGAL_CONTACT_PHONE',
    'LEGAL_EFFECTIVE_DATE',
]
def requiredFirebaseDartDefines = [
    // Release APK가 알림을 조용히 비활성화한 채 배포되지 않도록 운영 앱 설정도 필수로 검사한다.
    'FIREBASE_API_KEY',
    'FIREBASE_ANDROID_APP_ID',
    'FIREBASE_MESSAGING_SENDER_ID',
    'FIREBASE_PROJECT_ID',
]
def missingLegalDartDefines = requiredLegalDartDefines.findAll { name ->
    (dartDefines[name] ?: '').trim().isEmpty()
}
missingReleaseConfiguration.addAll(missingLegalDartDefines)
def missingFirebaseDartDefines = requiredFirebaseDartDefines.findAll { name ->
    (dartDefines[name] ?: '').trim().isEmpty()
}
missingReleaseConfiguration.addAll(missingFirebaseDartDefines)

if (isReleaseTaskRequested && !missingReleaseConfiguration.isEmpty()) {
    throw new GradleException(
        "Release build configuration is missing: ${missingReleaseConfiguration.join(', ')}"
    )
}

def releaseKeystoreFile = releaseKeystorePath.isEmpty() ? null : file(releaseKeystorePath)
if (isReleaseTaskRequested && releaseKeystoreFile != null && !releaseKeystoreFile.exists()) {
    throw new GradleException('ANDROID_KEYSTORE_PATH does not point to an existing file.')
}

android {
    namespace "com.gamjamubwatna.frontend"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    packagingOptions {
        jniLibs {
            excludes += ['lib/armeabi-v7a/**', 'lib/x86_64/**']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.gamjamubwatna.frontend"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        // health 13.3.1 requires Android API 26 or higher.
        minSdkVersion 26
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        ndk {
            // Kakao Maps SDK v2 ships ARM binaries only. Keeping the APK ARM64-only
            // also lets ARM translation capable emulators select the correct ABI.
            abiFilters 'arm64-v8a'
        }
        manifestPlaceholders = [
            kakaoRedirectScheme: "kakao${kakaoNativeAppKey}",
        ]
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile != null) {
                storeFile releaseKeystoreFile
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.kakao.maps.open:android:2.12.11'
}
