name: potato_mubwanna
description: Location-based tourism stamp rally app for Gangwon.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.7.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  freezed_annotation: ^2.4.4
  geolocator: ^13.0.2
  go_router: ^14.6.1
  json_annotation: ^4.9.0
  just_audio: ^0.9.42
  mobile_scanner: ^6.0.2
  permission_handler: ^11.3.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.3.3

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

