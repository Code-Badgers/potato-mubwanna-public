name: potato_mubwanna
description: Location-based tourism stamp rally app for Gangwon.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  cached_network_image: ^3.2.3
  dio: ^5.1.2
  firebase_core: ^2.13.0
  firebase_messaging: ^14.6.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.3.6
  flutter_secure_storage: ^8.0.0
  freezed_annotation: ^2.2.0
  geolocator: ^9.0.2
  go_router: ^8.0.0
  json_annotation: ^4.8.1
  just_audio: ^0.9.34
  permission_handler: ^10.2.0
  qr_flutter: ^4.1.0
  shared_preferences: ^2.1.1

dev_dependencies:
  build_runner: ^2.4.4
  flutter_lints: ^2.0.1
  flutter_test:
    sdk: flutter
  freezed: ^2.3.5
  json_serializable: ^6.7.0

flutter:
  uses-material-design: true
  assets:
    - assets/onboading.png
    - assets/onboading_02.png
    - assets/onboading_03.png
