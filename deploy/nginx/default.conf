map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 10m;

    location = /health {
        proxy_pass http://backend:8080/api/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location = /privacy-policy {
        alias /usr/share/nginx/html/legal/privacy-policy.html;
        default_type text/html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    location = /privacy-policy/ {
        absolute_redirect off;
        return 308 /privacy-policy;
    }

    location / {
        return 404;
    }
}
